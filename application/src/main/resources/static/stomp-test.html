<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>客服聊天系统测试页面</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            width: 960px;
            margin: 40px auto;
        }

        input {
            width: 250px;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            margin-left: 8px;
        }

        #log {
            margin-top: 20px;
            padding: 15px;
            height: 420px;
            background: #eeeeee;
            white-space: pre-wrap;
            overflow-y: auto;
            overflow-x: hidden;
            overflow-wrap: anywhere;
            box-sizing: border-box;
        }

        .panel {
            margin-top: 18px;
            padding: 14px;
            border: 1px solid #cccccc;
            border-radius: 6px;
        }

        .panel h3 {
            margin-top: 0;
        }

        .hint {
            color: #555555;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<h2>客服聊天系统测试页面</h2>

<div class="panel">
    <h3>网页登录</h3>
    <p>
        <label>
            用户名：
            <input id="loginUsername" autocomplete="username" placeholder="例如 U001、A001 或 admin">
        </label>
    </p>
    <p>
        <label>
            密码：
            <input id="loginPassword" type="password" autocomplete="current-password" value="123456">
        </label>
        <button id="loginButton" onclick="loginAndConnect()">登录并连接</button>
    </p>
    <p id="loginStatus" class="hint">当前未登录</p>
</div>

<label>
    登录Token：
</label>

<input
        id="token"
        placeholder="请粘贴登录接口返回结果中的 data.token"
        style="width: 500px"
>

<button onclick="connectStomp()">
    连接
</button>

<button onclick="disconnectStomp()">
    断开
</button>

<div class="panel">
    <h3>VIP客户与客服状态</h3>
    <p>
        <label>用户ID：<input id="vipUserId" placeholder="例如 U001"></label>
        <label>VIP等级：<input id="vipLevel" type="number" min="0" max="5" value="1"></label>
        <button onclick="updateVipCustomer()">设置VIP等级</button>
    </p>
    <p>
        <button onclick="setAgentOnline(true)">当前客服上线</button>
        <button onclick="setAgentOnline(false)">当前客服离线</button>
    </p>
    <p>
        <label>客服ID：<input id="vipAgentId" placeholder="例如 A001"></label>
        <button onclick="setVipAgentSkill(true)">加入VIP技能组</button>
        <button onclick="setVipAgentSkill(false)">移出VIP技能组</button>
        <button onclick="queryVipAgentSkills()">查询VIP技能组</button>
    </p>
</div>

<div class="panel">
<h3>聊天消息与历史记录</h3>

<p>
    <label>
        会话ID：
        <input
                id="sessionId"
                value="613ddee5-d654-431c-98c8-715755c4b9e0">
    </label>
</p>

<p>
    <label>
        clientMsgId：
        <input
                id="clientMsgId"
                placeholder="留空会自动生成">
    </label>
</p>

<p>
    <label>
        消息内容：
        <input
                id="messageContent"
                value="你好，这是一条STOMP聊天消息">
    </label>
</p>

<button onclick="sendChatMessage()">
    发送聊天消息
</button>
<button onclick="endChatSession()">
    结束当前会话
</button>
<button onclick="loadChatHistory()">
    加载聊天历史
</button>
</div>

<div class="panel">
    <h3>消息已读、编辑和撤回</h3>
    <p>
        <label>消息ID：<input id="messageId" placeholder="服务端返回的消息id"></label>
    </p>
    <p>
        <label>编辑后内容：<input id="editedMessageContent" value="这是编辑后的消息"></label>
    </p>
    <button onclick="markMessageRead()">标记已读</button>
    <button onclick="editChatMessage()">编辑消息</button>
    <button onclick="recallChatMessage()">撤回消息</button>
</div>

<div id="log"></div>


<script>

    let socket = null;
    let loggedInRoles = [];
    /*
     * 是否自动发送业务ACK
     *
     * true：收到消息后自动ACK
     * false：收到消息后不发送ACK
     */
    /*
 * 心跳定时器
 */
    let heartbeatTimer = null;


    /*
     * 心跳发送间隔：30秒
     */
    const HEARTBEAT_INTERVAL_MS = 30000;
    const AUTO_ACK = true;

    function writeLog(message) {

        const log =
            document.getElementById("log");

        log.textContent +=
            message + "\n";

        log.scrollTop = log.scrollHeight;
    }

    async function loginAndConnect() {
        const usernameInput = document.getElementById("loginUsername");
        const passwordInput = document.getElementById("loginPassword");
        const loginButton = document.getElementById("loginButton");
        const loginStatus = document.getElementById("loginStatus");
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username) {
            writeLog("请输入用户名");
            usernameInput.focus();
            return;
        }
        if (!password) {
            writeLog("请输入密码");
            passwordInput.focus();
            return;
        }

        loginButton.disabled = true;
        loginStatus.textContent = "正在登录……";

        try {
            const response = await fetch("/chat/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });
            const responseText = await response.text();
            let result = null;
            try {
                result = responseText ? JSON.parse(responseText) : null;
            } catch (ignored) {
                throw new Error("登录接口返回内容不是有效JSON");
            }

            if (!response.ok || !result || !result.data || !result.data.token) {
                const errorMessage = result && result.message
                    ? result.message
                    : "用户名或密码错误";
                throw new Error(errorMessage);
            }

            document.getElementById("token").value = result.data.token;
            document.title = "客服聊天系统 - " + result.data.username;
            loggedInRoles = Array.isArray(result.data.roles)
                ? result.data.roles
                : [];
            const roles = loggedInRoles.join(", ");
            loginStatus.textContent = "登录成功：" + result.data.username
                + "（" + result.data.userId + "）"
                + (roles ? "，角色：" + roles : "");
            writeLog("网页登录成功，正在自动连接WebSocket：" + result.data.userId);

            reconnectStomp();
        } catch (error) {
            loginStatus.textContent = "登录失败：" + error.message;
            writeLog("网页登录失败：" + error.message);
        } finally {
            loginButton.disabled = false;
        }
    }

    document.getElementById("loginPassword").addEventListener(
        "keydown",
        function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                loginAndConnect();
            }
        }
    );


    function connectStomp() {

        if (socket != null) {
            if (socket.readyState === WebSocket.CONNECTING) {
                writeLog("WebSocket正在连接，请勿重复点击连接");
                return;
            }
            if (socket.readyState === WebSocket.OPEN) {
                writeLog("WebSocket已经连接，无需重复连接");
                return;
            }
            if (socket.readyState === WebSocket.CLOSING) {
                writeLog("WebSocket正在关闭，请稍后再连接");
                return;
            }
        }

        const token =
            document.getElementById("token")
                .value
                .trim();


        if (!token) {

            writeLog("请先登录并输入Token");

            return;
        }


        const websocketProtocol =
            window.location.protocol === "https:"
                ? "wss://"
                : "ws://";


        const websocketUrl =
            websocketProtocol +
            window.location.host +
            "/ws/chat?token=" +
            encodeURIComponent(token);


        writeLog(
            "开始连接：" + websocketUrl
        );

        stopHeartbeat();

        /*
         * v12.stomp表示使用STOMP 1.2协议
         */
        socket =
            new WebSocket(
                websocketUrl,
                ["v12.stomp"]
            );


        /*
         * WebSocket握手成功
         */
        socket.onopen = function () {

            writeLog(
                "WebSocket握手成功"
            );


            /*
             * 发送STOMP CONNECT帧
             *
             * 最后的 \u0000 是STOMP帧结束标志
             */
            const connectFrame =
                "CONNECT\n" +
                "accept-version:1.2\n" +
                "host:localhost\n" +
                "heart-beat:0,0\n" +
                "\n" +
                "\u0000";


            socket.send(connectFrame);


            writeLog(
                "已经发送STOMP CONNECT帧"
            );
        };


        /*
         * 收到服务器返回的信息
         */
        socket.onmessage = function (event) {

            const message =
                event.data.replace(
                    /\u0000/g,
                    "\\0"
                );


            writeLog(
                "服务器返回：\n" + message
            );


            if (
                event.data.startsWith("CONNECTED")
            ) {

                writeLog(
                    "STOMP连接成功"
                );


                /*
                 * 订阅普通聊天消息
                 */
                const chatSubscribeFrame =
                    "SUBSCRIBE\n" +
                    "id:chat-subscription\n" +
                    "destination:/user/queue/chat\n" +
                    "ack:auto\n" +
                    "\n" +
                    "\u0000";


                socket.send(
                    chatSubscribeFrame
                );


                writeLog(
                    "已订阅：/user/queue/chat"
                );

                /* 已读、编辑和撤回事件统一从这个队列接收。 */
                const messageEventSubscribeFrame =
                    "SUBSCRIBE\n" +
                    "id:message-event-subscription\n" +
                    "destination:/user/queue/messages\n" +
                    "ack:auto\n" +
                    "\n" +
                    "\u0000";

                socket.send(messageEventSubscribeFrame);
                writeLog("已订阅：/user/queue/messages");


                /*
                 * 订阅当前连接的错误消息
                 */
                const errorSubscribeFrame =
                    "SUBSCRIBE\n" +
                    "id:error-subscription\n" +
                    "destination:/user/queue/errors\n" +
                    "ack:auto\n" +
                    "\n" +
                    "\u0000";


                socket.send(
                    errorSubscribeFrame
                );


                writeLog(
                    "已订阅：/user/queue/errors"
                );
                /*
 * 聊天队列和错误队列订阅完成后，
 * 主动请求拉取当前用户的离线消息
 */
                const offlinePullFrame =
                    "SEND\n" +
                    "destination:/app/chat.offline.pull\n" +
                    "content-type:application/json\n" +
                    "\n" +
                    "{}" +
                    "\u0000";


                socket.send(
                    offlinePullFrame
                );


                writeLog(
                    "已请求拉取离线消息"
                );
                /*
 * STOMP连接成功后启动心跳
 */
                startHeartbeat();

                if (loggedInRoles.includes("AGENT")) {
                    writeLog("检测到客服角色，正在自动上线");
                    void setAgentOnline(true);
                }
            }
            /*
 * 收到普通MESSAGE帧时，
 * 判断是不是一条聊天消息。
 */
            if (
                event.data.startsWith("MESSAGE")
            ) {

                const bodyText =
                    extractStompBody(
                        event.data
                    );


                if (bodyText) {

                    try {

                        const body =
                            JSON.parse(
                                bodyText
                            );


                        /*
                         * 会话创建通知的sessionId位于body.session.sessionId，
                         * 聊天消息、历史记录和会话事件则直接使用body.sessionId。
                         */
                        const receivedSessionId =
                            body["sessionId"] ||
                            (body["session"] && body["session"]["sessionId"]);

                        if (receivedSessionId) {
                            document.getElementById("sessionId").value =
                                receivedSessionId;
                        }


                        /*
                         * 真正的ChatMessage同时包含：
                         * id
                         * sessionId
                         * senderId
                         *
                         * SESSION_CREATED、ERROR、CHAT_HISTORY
                         * 不满足这些条件，因此不会误发ACK。
                         */
                        if (
                            body["id"] &&
                            body["sessionId"] &&
                            body["senderId"]
                        ) {

                            document.getElementById("messageId").value = body["id"];

                            /* RECEIVED/STORED是发送方状态回执，不能再当成接收消息ACK。 */
                            if (AUTO_ACK && !body["ackStatus"]) {

                                sendBusinessAck(
                                    body["id"]
                                );

                            } else if (!body["ackStatus"]) {

                                writeLog(
                                    "自动业务ACK已关闭，messageId："
                                    + body["id"]
                                );
                            }
                        }
                    } catch (error) {

                        /*
                         * 某些服务器帧不是JSON，
                         * 不需要因此中断页面。
                         */
                        writeLog(
                            "当前MESSAGE不是可确认的聊天消息"
                        );
                    }
                }
            }
        };


        /*
         * 连接关闭
         */
        socket.onclose = function () {
            stopHeartbeat();
            writeLog(
                "连接已经关闭"
            );

            socket = null;
        };


        /*
         * 连接出错
         */
        socket.onerror = function () {

            writeLog(
                "连接发生错误"
            );
        };
    }

    /** 账号重新登录时，等待旧连接完全关闭后再使用新Token连接。 */
    function reconnectStomp() {
        if (socket == null || socket.readyState === WebSocket.CLOSED) {
            connectStomp();
            return;
        }

        const previousSocket = socket;
        previousSocket.addEventListener(
            "close",
            function () {
                if (socket == null || socket === previousSocket) {
                    connectStomp();
                }
            },
            {once: true}
        );
        disconnectStomp();
    }
    /*
     * 发送业务消息ACK
     */
    function sendBusinessAck(messageId) {

        if (
            socket == null ||
            socket.readyState !== WebSocket.OPEN
        ) {

            writeLog(
                "ACK发送失败：连接已断开"
            );

            return;
        }


        const requestBody = {
            messageId: messageId
        };


        const ackFrame =
            "SEND\n" +
            "destination:/app/chat.ack\n" +
            "content-type:application/json\n" +
            "\n" +
            JSON.stringify(requestBody) +
            "\u0000";


        socket.send(
            ackFrame
        );


        writeLog(
            "已发送业务ACK，messageId："
            + messageId
        );
    }
    /**
     * 向服务端发送一次心跳
     */
    function sendHeartbeat() {

        /*
         * WebSocket不存在或没有处于连接状态时，
         * 不发送心跳。
         */
        if (
            socket === null ||
            socket.readyState !== WebSocket.OPEN
        ) {

            return;
        }


        /*
         * 构造STOMP SEND帧
         *
         * 对应服务端：
         * @MessageMapping("/chat.heartbeat")
         */
        const frame =
            "SEND\n"
            + "destination:/app/chat.heartbeat\n"
            + "content-type:application/json\n"
            + "\n"
            + "{}\u0000";


        socket.send(
            frame
        );
    }


    /**
     * 开始定时发送心跳
     */
    function startHeartbeat() {

        /*
         * 先停止旧定时器，
         * 防止重复连接后出现多个心跳定时器。
         */
        stopHeartbeat();


        /*
         * STOMP连接成功后立即发送一次心跳，
         * 不需要先等待30秒。
         */
        sendHeartbeat();


        /*
         * 之后每30秒发送一次。
         */
        heartbeatTimer =
            setInterval(
                sendHeartbeat,
                HEARTBEAT_INTERVAL_MS
            );
    }


    /**
     * 停止心跳定时器
     */
    function stopHeartbeat() {

        if (heartbeatTimer !== null) {

            clearInterval(
                heartbeatTimer
            );


            heartbeatTimer = null;
        }
    }
    /*
 * 从STOMP帧中提取JSON消息体
 */
    function extractStompBody(frame) {

        const bodyStart =
            frame.indexOf("\n\n");


        if (bodyStart === -1) {

            return null;
        }


        return frame
            .substring(bodyStart + 2)
            .replace(/\u0000/g, "")
            .trim();
    }
    function sendChatMessage() {

        if (
            socket == null ||
            socket.readyState !== WebSocket.OPEN
        ) {

            writeLog(
                "请先建立STOMP连接"
            );

            return;
        }


        const sessionId =
            document.getElementById(
                "sessionId"
            ).value.trim();


        const messageContent =
            document.getElementById(
                "messageContent"
            ).value.trim();


        const clientMsgIdInput =
            document.getElementById(
                "clientMsgId"
            );


        let clientMsgId =
            clientMsgIdInput.value.trim();


        if (!sessionId) {

            writeLog(
                "请输入会话ID"
            );

            return;
        }


        if (!messageContent) {

            writeLog(
                "请输入消息内容"
            );

            return;
        }


        /*
         * clientMsgId为空时自动生成。
         * 生成后写回输入框。
         *
         * 因此再次点击发送时，
         * 会继续使用同一个clientMsgId，
         * 方便测试消息去重。
         */
        if (!clientMsgId) {

            clientMsgId =
                "client-" + Date.now();

            clientMsgIdInput.value =
                clientMsgId;
        }


        const messageBody = {

            sessionId: sessionId,

            type: "TEXT",

            content: messageContent,

            clientMsgId: clientMsgId
        };


        const sendFrame =
            "SEND\n" +
            "destination:/app/chat.send\n" +
            "content-type:application/json\n" +
            "\n" +
            JSON.stringify(messageBody) +
            "\u0000";


        socket.send(
            sendFrame
        );

        /* 当前消息发送后清空，下次发送时自动生成新的幂等消息ID。 */
        clientMsgIdInput.value = "";


        writeLog(
            "已发送聊天消息：\n"
            + JSON.stringify(
                messageBody,
                null,
                2
            )
        );
    }
    function endChatSession() {

        if (
            socket == null ||
            socket.readyState !== WebSocket.OPEN
        ) {

            writeLog(
                "请先建立STOMP连接"
            );

            return;
        }


        const sessionId =
            document.getElementById(
                "sessionId"
            ).value.trim();


        if (!sessionId) {

            writeLog(
                "请输入会话ID"
            );

            return;
        }


        const requestBody = {
            sessionId: sessionId
        };


        const endFrame =
            "SEND\n" +
            "destination:/app/chat.end\n" +
            "content-type:application/json\n" +
            "\n" +
            JSON.stringify(requestBody) +
            "\u0000";


        socket.send(
            endFrame
        );


        writeLog(
            "已发送结束会话请求：\n"
            + JSON.stringify(
                requestBody,
                null,
                2
            )
        );
    }
    function loadChatHistory() {

        /*
         * 1. 检查连接
         */
        if (
            socket == null ||
            socket.readyState !== WebSocket.OPEN
        ) {

            writeLog(
                "请先建立STOMP连接"
            );

            return;
        }


        /*
         * 2. 获取会话ID
         */
        const sessionId =
            document.getElementById(
                "sessionId"
            ).value.trim();


        if (!sessionId) {

            writeLog(
                "请输入会话ID"
            );

            return;
        }


        /*
         * 3. 构造请求数据
         */
        const requestBody = {
            sessionId: sessionId
        };


        /*
         * 4. 构造STOMP SEND帧
         */
        const historyFrame =
            "SEND\n" +
            "destination:/app/chat.history\n" +
            "content-type:application/json\n" +
            "\n" +
            JSON.stringify(requestBody) +
            "\u0000";


        /*
         * 5. 发送查询请求
         */
        socket.send(
            historyFrame
        );


        writeLog(
            "已发送聊天历史查询：\n"
            + JSON.stringify(
                requestBody,
                null,
                2
            )
        );
    }

    function requireToken() {
        const token = document.getElementById("token").value.trim();
        if (!token) {
            writeLog("请先粘贴登录Token");
            return null;
        }
        return token;
    }

    async function callRest(method, path, requestBody) {
        const token = requireToken();
        if (!token) {
            return null;
        }
        const options = {
            method: method,
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }
        };
        if (requestBody !== undefined && requestBody !== null) {
            options.body = JSON.stringify(requestBody);
        }
        try {
            const response = await fetch(path, options);
            const text = await response.text();
            let body = text;
            try {
                body = text ? JSON.parse(text) : null;
            } catch (ignored) {
                // 非JSON响应直接显示原文。
            }
            writeLog(method + " " + path + "\nHTTP " + response.status + "\n"
                + (body == null ? "" : JSON.stringify(body, null, 2)));
            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }
            return body;
        } catch (error) {
            writeLog("REST请求失败：" + error.message);
            return null;
        }
    }

    async function updateVipCustomer() {
        const userId = document.getElementById("vipUserId").value.trim();
        const vipLevelText = document.getElementById("vipLevel").value.trim();
        const vipLevel = Number(vipLevelText);
        if (!userId) {
            writeLog("请输入需要设置VIP的用户ID");
            return;
        }
        if (!Number.isInteger(vipLevel) || vipLevel < 0 || vipLevel > 5) {
            writeLog("VIP等级必须是0到5之间的整数");
            return;
        }
        await callRest(
            "PUT",
            "/users/" + encodeURIComponent(userId),
            {vipLevel: vipLevel}
        );
    }

    async function setAgentOnline(online) {
        await callRest(
            "POST",
            online ? "/chat/agent/online" : "/chat/agent/offline",
            null
        );
    }

    async function setVipAgentSkill(enabled) {
        const agentId = document.getElementById("vipAgentId").value.trim();
        if (!agentId) {
            writeLog("请输入客服ID");
            return;
        }
        await callRest(
            enabled ? "PUT" : "DELETE",
            "/chat/agents/" + encodeURIComponent(agentId) + "/vip-skill",
            null
        );
    }

    async function queryVipAgentSkills() {
        await callRest("GET", "/chat/agents/vip-skill", null);
    }

    function sendStompJson(destination, requestBody, actionName) {
        if (socket == null || socket.readyState !== WebSocket.OPEN) {
            writeLog("请先建立STOMP连接");
            return false;
        }
        const frame =
            "SEND\n" +
            "destination:" + destination + "\n" +
            "content-type:application/json\n" +
            "\n" +
            JSON.stringify(requestBody) +
            "\u0000";
        socket.send(frame);
        writeLog(actionName + "：\n" + JSON.stringify(requestBody, null, 2));
        return true;
    }

    function requireMessageOperationInput(requireSession) {
        const messageId = document.getElementById("messageId").value.trim();
        const sessionId = document.getElementById("sessionId").value.trim();
        if (!messageId) {
            writeLog("请输入服务端消息ID");
            return null;
        }
        if (requireSession && !sessionId) {
            writeLog("请输入会话ID");
            return null;
        }
        return {messageId: messageId, sessionId: sessionId};
    }

    function markMessageRead() {
        const input = requireMessageOperationInput(true);
        if (!input) {
            return;
        }
        sendStompJson(
            "/app/chat.read",
            {sessionId: input.sessionId, lastReadMessageId: input.messageId},
            "已发送标记已读请求"
        );
    }

    function editChatMessage() {
        const input = requireMessageOperationInput(false);
        if (!input) {
            return;
        }
        const content = document.getElementById("editedMessageContent").value.trim();
        if (!content) {
            writeLog("请输入编辑后的消息内容");
            return;
        }
        sendStompJson(
            "/app/chat.message.edit",
            {messageId: input.messageId, content: content},
            "已发送消息编辑请求"
        );
    }

    function recallChatMessage() {
        const input = requireMessageOperationInput(false);
        if (!input) {
            return;
        }
        sendStompJson(
            "/app/chat.message.recall",
            {messageId: input.messageId},
            "已发送消息撤回请求"
        );
    }

    function disconnectStomp() {
        stopHeartbeat();
        if (socket == null || socket.readyState === WebSocket.CLOSED) {

            writeLog(
                "当前没有已连接的STOMP会话"
            );

            return;
        }

        if (socket.readyState === WebSocket.CONNECTING) {
            socket.close();
            writeLog("正在取消WebSocket连接");
            return;
        }

        if (socket.readyState === WebSocket.CLOSING) {
            writeLog("WebSocket正在关闭");
            return;
        }


        /*
         * 先发送STOMP DISCONNECT帧
         */
        const disconnectFrame =
            "DISCONNECT\n" +
            "receipt:disconnect-001\n" +
            "\n" +
            "\u0000";


        socket.send(
            disconnectFrame
        );


        /*
         * 然后关闭WebSocket
         */
        socket.close();


        writeLog(
            "已经发送断开请求"
        );
    }

</script>
