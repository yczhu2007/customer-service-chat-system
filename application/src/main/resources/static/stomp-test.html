<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>客服聊天系统测试页面</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: #1f2937;
            background: #f3f6fb;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        button, input { font: inherit; }
        button {
            padding: 9px 16px;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            background: #2563eb;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        input {
            min-width: 0;
            padding: 9px 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
        .page { width: min(1180px, calc(100% - 32px)); margin: 24px auto; }
        .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .login-card { width: min(420px, 100%); padding: 28px; border: 1px solid #e5e7eb; border-radius: 16px; background: #ffffff; box-shadow: 0 12px 35px rgba(15, 23, 42, .10); }
        .login-card h1 { margin: 0 0 8px; font-size: 25px; text-align: center; }
        .login-card > .hint { margin: 0 0 22px; text-align: center; }
        .login-card button { width: 100%; margin-top: 4px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .page-header h1 { margin: 0; font-size: 25px; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .account-text { color: #64748b; font-size: 13px; }
        .status-badge { padding: 7px 12px; border-radius: 999px; background: #e5e7eb; color: #4b5563; }
        .status-badge.online { color: #166534; background: #dcfce7; }
        .layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start; }
        .layout.admin-layout { grid-template-columns: minmax(330px, 720px); justify-content: center; }
        .sidebar { display: grid; gap: 14px; }
        .panel, .chat-card {
            padding: 17px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 5px 18px rgba(15, 23, 42, .05);
        }
        .panel h2, .chat-card h2 { margin: 0 0 14px; font-size: 17px; }
        .field { display: grid; gap: 6px; margin-bottom: 11px; color: #4b5563; font-size: 14px; }
        .field input { width: 100%; }
        .button-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .button-row button { flex: 1 1 auto; }
        .secondary { color: #1f2937; background: #eef2f7; }
        .secondary:hover { background: #e2e8f0; }
        .danger { background: #dc2626; }
        .danger:hover { background: #b91c1c; }
        .hint { margin: 10px 0 0; color: #64748b; font-size: 13px; line-height: 1.55; }
        [hidden] { display: none !important; }
        .operation-result { margin-top: 12px; padding: 10px 12px; border-radius: 8px; color: #475569; background: #f1f5f9; font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
        .operation-result.success { color: #166534; background: #dcfce7; }
        .operation-result.error { color: #991b1b; background: #fee2e2; }
        .advanced { margin-top: 12px; }
        .advanced summary { color: #475569; cursor: pointer; }
        .chat-card { padding: 0; overflow: hidden; }
        .chat-header { padding: 16px 18px; border-bottom: 1px solid #e5e7eb; }
        .chat-header h2 { margin-bottom: 5px; }
        .session-text { color: #64748b; font-size: 13px; overflow-wrap: anywhere; }
        .counterpart-text { margin-top: 4px; color: #2563eb; font-size: 14px; font-weight: 600; }
        #chatMessages {
            height: 500px;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
        }
        .empty-chat { margin-top: 180px; color: #94a3b8; text-align: center; }
        .message-row { display: flex; margin-bottom: 14px; }
        .message-row.mine { justify-content: flex-end; }
        .message-bubble { max-width: 72%; padding: 10px 13px; border-radius: 13px; background: #ffffff; box-shadow: 0 1px 4px rgba(15, 23, 42, .12); overflow-wrap: anywhere; }
        .message-row.mine .message-bubble { color: #ffffff; background: #2563eb; }
        .message-row.selectable .message-bubble { cursor: pointer; }
        .message-row.selected .message-bubble { outline: 3px solid #f59e0b; outline-offset: 2px; }
        .message-row.system { justify-content: center; }
        .message-row.system .message-bubble { max-width: 90%; padding: 7px 12px; color: #475569; background: #e2e8f0; font-size: 13px; text-align: center; }
        .message-row.error .message-bubble { color: #991b1b; background: #fee2e2; }
        .message-meta { margin-bottom: 4px; color: #94a3b8; font-size: 11px; }
        .message-row.mine .message-meta { color: #dbeafe; text-align: right; }
        .chat-composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 15px; border-top: 1px solid #e5e7eb; }
        .chat-composer input { width: 100%; }
        .chat-footer-status { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 15px 14px; }
        .chat-footer-status .hint { margin: 0; }
        #log { max-height: 220px; padding: 12px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: #475569; background: #f8fafc; font: 12px/1.55 Consolas, monospace; }
        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
            #chatMessages { height: 420px; }
        }
    </style>
</head>

<body>
<section id="loginView" class="login-screen">
    <div class="login-card">
        <h1>客服聊天系统</h1>
        <p class="hint">请使用系统账号登录</p>
        <label class="field">用户名
            <input id="loginUsername" autocomplete="username" placeholder="请输入用户名">
        </label>
        <label class="field">密码
            <input id="loginPassword" type="password" autocomplete="current-password" value="123456">
        </label>
        <button id="loginButton" onclick="loginAndConnect()">登录</button>
        <p id="loginStatus" class="hint">当前未登录</p>
    </div>
</section>

<main id="appView" class="page" hidden>
    <header class="page-header">
        <h1 id="workspaceTitle">客服聊天系统</h1>
        <div class="header-actions">
            <span id="currentAccountText" class="account-text"></span>
            <span id="connectionStatus" class="status-badge">未连接</span>
            <button class="secondary" onclick="switchAccount()">切换账号</button>
        </div>
    </header>

    <div id="mainLayout" class="layout">
        <aside class="sidebar">
            <section id="connectionPanel" class="panel">
                <h2>连接状态</h2>
                <p id="connectionDescription" class="hint">聊天连接尚未建立</p>
                <div class="button-row">
                    <button id="connectButton" onclick="connectStomp()" disabled>连接</button>
                    <button id="disconnectButton" class="secondary" onclick="disconnectStomp()" disabled>断开连接</button>
                </div>
                <details id="tokenConnector" class="advanced">
                    <summary>Token 连接</summary>
                    <label class="field">登录 Token<input id="token" placeholder="登录后自动填写"></label>
                    <button onclick="connectStomp()">使用 Token 连接</button>
                </details>
            </section>

            <section id="sessionPanel" class="panel">
                <h2>会话操作</h2>
                <input id="sessionId" type="hidden">
                <p id="sessionOperationHint" class="hint">当前暂无进行中的会话</p>
                <div class="button-row">
                    <button id="loadHistoryButton" class="secondary" onclick="loadChatHistory()" disabled>加载历史</button>
                    <button id="endSessionButton" class="danger" onclick="endChatSession()" disabled>结束会话</button>
                </div>
            </section>

            <section id="messagePanel" class="panel">
                <h2>消息操作</h2>
                <input id="messageId" type="hidden">
                <p id="messageOperationHint" class="hint">点击聊天气泡可以选择要操作的消息</p>
                <label class="field">编辑后的内容
                    <input id="editedMessageContent" value="这是编辑后的消息">
                </label>
                <div class="button-row">
                    <button id="markReadButton" class="secondary" onclick="markMessageRead()" disabled>标记已读</button>
                    <button id="editMessageButton" class="secondary" onclick="editChatMessage()" disabled>编辑</button>
                    <button id="recallMessageButton" class="secondary" onclick="recallChatMessage()" disabled>撤回</button>
                </div>
            </section>

            <section id="agentPanel" class="panel" hidden>
                <h2>客服工作状态</h2>
                <p id="agentStatusText" class="hint">正在同步客服状态……</p>
                <div class="button-row" style="margin-top:10px">
                    <button id="agentOnlineButton" onclick="setAgentOnline(true)" disabled>上线</button>
                    <button id="agentOfflineButton" class="secondary" onclick="setAgentOnline(false)" disabled>离线</button>
                </div>
                <div id="agentOperationResult" class="operation-result" hidden></div>
            </section>

            <section id="adminPanel" class="panel" hidden>
                <h2>管理员功能</h2>
                <label class="field">用户 ID<input id="vipUserId" placeholder="例如 U001"></label>
                <label class="field">VIP 等级<input id="vipLevel" type="number" min="0" max="5" value="1"></label>
                <button onclick="updateVipCustomer()">设置 VIP</button>
                <label class="field" style="margin-top:10px">客服 ID<input id="vipAgentId" placeholder="例如 A001"></label>
                <div class="button-row">
                    <button class="secondary" onclick="setVipAgentSkill(true)">加入 VIP 组</button>
                    <button class="secondary" onclick="setVipAgentSkill(false)">移出 VIP 组</button>
                    <button class="secondary" onclick="queryVipAgentSkills()">查询 VIP 客服</button>
                </div>
                <div id="adminOperationResult" class="operation-result" hidden></div>
            </section>

            <details class="panel">
                <summary><strong>调试信息</strong></summary>
                <div id="log"></div>
            </details>
        </aside>

        <section id="chatCard" class="chat-card">
            <div class="chat-header">
                <h2>当前聊天</h2>
                <div id="currentSessionText" class="session-text">尚未建立会话</div>
                <div id="chatCounterpartText" class="counterpart-text">对话对象：等待分配</div>
            </div>
            <div id="chatMessages">
                <div id="emptyChat" class="empty-chat">登录后即可接收和发送消息</div>
            </div>
            <div class="chat-composer">
                <input id="messageContent" value="你好，这是一条聊天消息" placeholder="输入消息，按 Enter 发送">
                <input id="clientMsgId" type="hidden">
                <button id="sendMessageButton" onclick="sendChatMessage()" disabled>发送</button>
            </div>
            <div class="chat-footer-status">
                <div id="chatActionHint" class="hint">请先登录并建立聊天连接</div>
                <button id="restartConsultationButton" onclick="restartConsultation()" hidden>重新咨询</button>
            </div>
        </section>
    </div>
</main>


<script>

    let socket = null;
    let stompConnected = false;
    let loggedInRoles = [];
    let loggedInUserId = null;
    let currentCounterpartId = null;
    let agentOnlineState = null;
    let agentStateChanging = false;
    let agentTargetOnline = null;
    let sessionActive = false;
    let canRestartConsultation = false;
    let pendingAgentSessionNotices = [];
    /*
     * 是否自动发送业务ACK
     *
     * true：收到消息后自动ACK
     * false：收到消息后不发送ACK
     */
    /*
 * 心跳定时器
 */
    let heartbeatTimer = null;


    /*
     * 心跳发送间隔：30秒
     */
    const HEARTBEAT_INTERVAL_MS = 30000;
    const AUTO_ACK = true;

    function writeLog(message) {
        const log = document.getElementById("log");
        const time = new Date().toLocaleTimeString("zh-CN", {hour12: false});
        log.textContent += "[" + time + "] " + message + "\n";
        log.scrollTop = log.scrollHeight;
    }

    function setConnectionStatus(text, online) {
        const status = document.getElementById("connectionStatus");
        status.textContent = text;
        status.classList.toggle("online", Boolean(online));
    }

    function setConnectionDescription(message) {
        document.getElementById("connectionDescription").textContent = message;
    }

    function updateRolePanels() {
        const isAdmin = loggedInRoles.includes("ADMIN");
        const isAgent = loggedInRoles.includes("AGENT");
        document.getElementById("workspaceTitle").textContent = isAdmin
            ? "客服聊天系统 · 管理后台"
            : (isAgent ? "客服聊天系统 · 客服工作台" : "客服聊天系统 · 用户端");
        document.getElementById("adminPanel").hidden = !isAdmin;
        document.getElementById("agentPanel").hidden = isAdmin || !isAgent;
        document.getElementById("sessionPanel").hidden = isAdmin;
        document.getElementById("messagePanel").hidden = isAdmin;
        document.getElementById("chatCard").hidden = isAdmin;
        document.getElementById("connectionPanel").hidden = isAdmin;
        document.getElementById("tokenConnector").hidden = isAdmin;
        document.getElementById("disconnectButton").hidden = isAdmin;
        document.getElementById("endSessionButton").hidden = !isAgent;
        document.getElementById("mainLayout").classList.toggle("admin-layout", isAdmin);
        if (isAdmin) {
            setConnectionStatus("管理模式", false);
        }
        updateActionAvailability();
    }

    function setAgentWorkState(online) {
        agentOnlineState = online;
        const onlineButton = document.getElementById("agentOnlineButton");
        const offlineButton = document.getElementById("agentOfflineButton");
        const statusText = document.getElementById("agentStatusText");

        onlineButton.disabled = online;
        offlineButton.disabled = !online;
        onlineButton.className = online ? "secondary" : "";
        offlineButton.className = online ? "danger" : "secondary";
        statusText.textContent = online
            ? "当前接待状态：在线，可以接收新的用户会话"
            : "当前接待状态：离线，不会再分配新的用户会话";

        if (stompConnected) {
            setConnectionStatus(online ? "客服在线" : "客服已离线", online);
            setConnectionDescription(online
                ? "消息连接正常，当前可以接待用户"
                : "消息连接保持正常，可以点击“上线”重新开始接待");
        }
    }

    function setAgentStateLoading(message) {
        document.getElementById("agentOnlineButton").disabled = true;
        document.getElementById("agentOfflineButton").disabled = true;
        document.getElementById("agentStatusText").textContent = message;
    }

    function updateActionAvailability() {
        const isAdmin = loggedInRoles.includes("ADMIN");
        const isUser = loggedInRoles.includes("USER")
            && !loggedInRoles.includes("AGENT")
            && !isAdmin;
        const sessionId = document.getElementById("sessionId").value.trim();
        const messageId = document.getElementById("messageId").value.trim();
        const socketActive = socket != null
            && socket.readyState !== WebSocket.CLOSED
            && socket.readyState !== WebSocket.CLOSING;

        document.getElementById("connectButton").disabled = isAdmin || socketActive;
        document.getElementById("disconnectButton").disabled = isAdmin || !socketActive;
        document.getElementById("sendMessageButton").disabled = isAdmin || !stompConnected || !sessionId || !sessionActive;
        document.getElementById("loadHistoryButton").disabled = isAdmin || !stompConnected || !sessionId;
        document.getElementById("endSessionButton").disabled = isAdmin || !stompConnected || !sessionId || !sessionActive;
        document.getElementById("markReadButton").disabled = isAdmin || !stompConnected || !sessionId || !sessionActive || !messageId;
        document.getElementById("editMessageButton").disabled = isAdmin || !stompConnected || !sessionActive || !messageId;
        document.getElementById("recallMessageButton").disabled = isAdmin || !stompConnected || !sessionActive || !messageId;
        const restartButton = document.getElementById("restartConsultationButton");
        restartButton.hidden = !isUser || !canRestartConsultation;
        restartButton.disabled = !stompConnected;

        const hint = document.getElementById("chatActionHint");
        if (!loggedInUserId) {
            hint.textContent = "请先登录并建立聊天连接";
        } else if (!stompConnected) {
            hint.textContent = "聊天连接尚未建立，暂时不能发送或操作消息";
        } else if (!sessionId) {
            hint.textContent = "连接已建立，等待系统分配会话";
        } else if (!sessionActive) {
            hint.textContent = "当前会话已经结束，可以继续加载聊天历史";
        } else {
            hint.textContent = "连接正常，可以发送消息";
        }
    }

    function showChatError(message) {
        appendSystemMessage(message, true);
        writeLog(message);
    }

    function showOperationResult(elementId, message, isError) {
        const result = document.getElementById(elementId);
        result.textContent = message;
        result.hidden = false;
        result.classList.toggle("success", !isError);
        result.classList.toggle("error", Boolean(isError));
    }

    function updateSessionDisplay(sessionId) {
        const sessionText = sessionId
            ? (sessionActive ? "会话进行中" : "上一段会话已结束")
            : "尚未建立会话";
        document.getElementById("currentSessionText").textContent = sessionText;
        document.getElementById("sessionOperationHint").textContent = sessionId
            ? (sessionActive
                ? "可以查看聊天记录" + (loggedInRoles.includes("AGENT") ? "或结束当前会话" : "")
                : "可以查看上一段会话的聊天记录")
            : "当前暂无进行中的会话";
        updateCounterpartDisplay();
        updateActionAvailability();
    }

    function updateCounterpartDisplay() {
        const label = loggedInRoles.includes("AGENT") ? "用户" : "客服";
        let value = currentCounterpartId || "等待分配";
        if (currentCounterpartId && !sessionActive) {
            value = "上一位" + label + " " + currentCounterpartId;
            document.getElementById("chatCounterpartText").textContent = value;
            return;
        }
        document.getElementById("chatCounterpartText").textContent = label + "：" + value;
    }

    function updateCounterpartFromPayload(body) {
        const session = body.session || body;
        const counterpartId = loggedInRoles.includes("AGENT")
            ? session.userId
            : session.agentId;
        if (counterpartId) {
            currentCounterpartId = counterpartId;
        } else if (body.senderId && body.senderId !== loggedInUserId) {
            currentCounterpartId = body.senderId;
        }
        updateCounterpartDisplay();
    }

    function clearEmptyChat() {
        const empty = document.getElementById("emptyChat");
        if (empty) {
            empty.remove();
        }
    }

    function formatMessageTime(value) {
        if (!value) {
            return new Date().toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"});
        }
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleTimeString("zh-CN", {
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function appendChatBubble(content, options) {
        const config = options || {};
        const container = document.getElementById("chatMessages");
        clearEmptyChat();

        const row = document.createElement("div");
        row.className = "message-row " + (config.kind || "system");
        if (config.messageId) {
            row.dataset.messageId = config.messageId;
        }
        if (config.clientMsgId) {
            row.dataset.clientMsgId = config.clientMsgId;
        }

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        if (config.sender || config.time) {
            const meta = document.createElement("div");
            meta.className = "message-meta";
            meta.textContent = [config.sender, formatMessageTime(config.time)].filter(Boolean).join(" · ");
            bubble.appendChild(meta);
        }
        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = content;
        bubble.appendChild(text);
        row.appendChild(bubble);
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
        return row;
    }

    function appendSystemMessage(message, isError) {
        appendChatBubble(message, {kind: isError ? "system error" : "system"});
    }

    function renderChatMessage(body) {
        const mine = body.senderId && body.senderId === loggedInUserId;
        let existing = null;
        if (body.clientMsgId) {
            existing = Array.from(document.querySelectorAll("[data-client-msg-id]"))
                .find(element => element.dataset.clientMsgId === body.clientMsgId) || null;
        }

        if (existing) {
            if (body.id) {
                existing.dataset.messageId = body.id;
                existing.classList.add("selectable");
            }
            if (body.ackStatus) {
                const meta = existing.querySelector(".message-meta");
                if (meta) {
                    meta.textContent = "我 · " + (body.ackStatus === "STORED" ? "已保存" : "已送达服务器");
                }
            }
            return;
        }

        const row = appendChatBubble(body.recalled ? "该消息已撤回" : (body.content || "[非文本消息]"), {
            kind: mine ? "mine" : "other",
            sender: mine ? "我" : (body.senderId || "对方"),
            time: body.createTime,
            messageId: body.id,
            clientMsgId: body.clientMsgId
        });
        if (body.id) {
            row.classList.add("selectable");
        }
    }

    function selectMessage(row) {
        if (!row || !row.dataset.messageId) {
            return;
        }
        document.querySelectorAll(".message-row.selected")
            .forEach(element => element.classList.remove("selected"));
        row.classList.add("selected");
        document.getElementById("messageId").value = row.dataset.messageId;
        document.getElementById("messageOperationHint").textContent = "已选择一条消息";
        updateActionAvailability();
    }

    function renderHistory(body) {
        const container = document.getElementById("chatMessages");
        container.innerHTML = "";
        document.getElementById("messageId").value = "";
        document.getElementById("messageOperationHint").textContent = "点击聊天气泡可以选择要操作的消息";
        const messages = Array.isArray(body.messages) ? body.messages : [];
        messages.forEach(renderChatMessage);
        if (messages.length === 0) {
            appendSystemMessage("当前会话暂无历史消息");
        } else {
            appendSystemMessage("已加载 " + messages.length + " 条历史消息，共 " + (body.total ?? messages.length) + " 条");
        }
    }

    function renderMessageMutation(body) {
        const row = body.messageId
            ? Array.from(document.querySelectorAll("[data-message-id]"))
                .find(element => element.dataset.messageId === body.messageId)
            : null;
        if (row) {
            const text = row.querySelector(".message-text");
            if (text) {
                text.textContent = body.event === "MESSAGE_RECALLED" ? "该消息已撤回" : body.content;
            }
        }
        appendSystemMessage(body.event === "MESSAGE_RECALLED" ? "一条消息已撤回" : "一条消息已编辑");
    }

    function formatSessionCloseReason(reason) {
        const reasons = {
            AGENT_OFFLINE: "客服已离线",
            MANUAL_END: "会话已主动结束",
            WEBSOCKET_DISCONNECT: "聊天连接已断开",
            HEARTBEAT_TIMEOUT: "连接心跳超时",
            AGENT_DISCONNECTED: "客服连接已断开",
            SESSION_INACTIVITY_TIMEOUT: "会话长时间无操作"
        };
        return reason ? (reasons[reason] || reason) : "";
    }

    function renderServerPayload(body) {
        if (!body || typeof body !== "object") {
            appendSystemMessage(String(body || "服务器返回了空消息"));
            return;
        }

        const isSessionActivation = body.event === "SESSION_CREATED"
            || body.event === "SESSION_RECONNECTED";
        if (isSessionActivation && loggedInRoles.includes("AGENT")
            && agentStateChanging && agentTargetOnline === true) {
            pendingAgentSessionNotices.push(body);
            return;
        }
        if (isSessionActivation || (body.id && body.sessionId && body.senderId)) {
            sessionActive = true;
            canRestartConsultation = false;
        }
        updateCounterpartFromPayload(body);

        const receivedSessionId = body.sessionId || (body.session && body.session.sessionId);
        if (receivedSessionId) {
            document.getElementById("sessionId").value = receivedSessionId;
            updateSessionDisplay(receivedSessionId);
        }

        if (body.id && body.sessionId && body.senderId) {
            renderChatMessage(body);
            return;
        }
        if (body.event === "CHAT_HISTORY") {
            renderHistory(body);
            return;
        }
        if (body.event === "MESSAGE_EDITED" || body.event === "MESSAGE_RECALLED") {
            renderMessageMutation(body);
            return;
        }
        if (body.event === "MESSAGES_READ") {
            const isCurrentUser = body.readerId === loggedInUserId;
            if (body.markedCount > 0) {
                appendSystemMessage((isCurrentUser ? "你" : (body.readerId || "对方"))
                    + "已将 " + body.markedCount + " 条消息标记为已读");
            } else if (isCurrentUser) {
                appendSystemMessage("当前没有新的未读消息");
            } else {
                appendSystemMessage("对方已同步已读状态");
            }
            return;
        }
        if (body.event === "SESSION_CREATED") {
            const agentId = body.session && body.session.agentId;
            appendSystemMessage("会话创建成功" + (agentId ? "，客服：" + agentId : ""));
            return;
        }
        if (body.event === "SESSION_RECONNECTED") {
            appendSystemMessage("已恢复原有会话");
            return;
        }
        if (body.event === "WAITING_FOR_AGENT") {
            canRestartConsultation = false;
            currentCounterpartId = null;
            updateCounterpartDisplay();
            updateActionAvailability();
            const position = body.waitingPosition ? "，当前排在第 " + body.waitingPosition + " 位" : "";
            const eta = body.estimatedWaitSeconds != null ? "，预计等待 " + body.estimatedWaitSeconds + " 秒" : "";
            appendSystemMessage((body.message || "暂无可用客服，已进入等待队列") + position + eta);
            return;
        }
        if (body.event === "ERROR") {
            if (!sessionActive && loggedInRoles.includes("USER")) {
                canRestartConsultation = true;
                updateActionAvailability();
            }
            appendSystemMessage(body.message || "服务器处理失败", true);
            return;
        }
        if (body.event === "SESSION_CLOSED" || body.event === "SESSION_ENDED") {
            const reasonText = formatSessionCloseReason(body.reason);
            appendSystemMessage("当前会话已结束" + (reasonText ? "：" + reasonText : ""));
            sessionActive = false;
            canRestartConsultation = loggedInRoles.includes("USER")
                && !loggedInRoles.includes("AGENT")
                && !loggedInRoles.includes("ADMIN");
            document.getElementById("messageId").value = "";
            document.getElementById("messageOperationHint").textContent = "点击聊天气泡可以选择要操作的消息";
            updateSessionDisplay(document.getElementById("sessionId").value.trim());
            return;
        }
        if (body.event === "SESSION_TRANSFERRED") {
            appendSystemMessage("会话已转接" + (body.targetAgentId ? "给客服 " + body.targetAgentId : ""));
            return;
        }
        if (body.event && body.message) {
            appendSystemMessage(body.message);
            return;
        }
        if (body.message) {
            appendSystemMessage(body.message);
            return;
        }
        appendSystemMessage("服务器操作已完成");
    }

    async function loginAndConnect() {
        const usernameInput = document.getElementById("loginUsername");
        const passwordInput = document.getElementById("loginPassword");
        const loginButton = document.getElementById("loginButton");
        const loginStatus = document.getElementById("loginStatus");
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username) {
            loginStatus.textContent = "请输入用户名";
            usernameInput.focus();
            return;
        }
        if (!password) {
            loginStatus.textContent = "请输入密码";
            passwordInput.focus();
            return;
        }

        loginButton.disabled = true;
        loginStatus.textContent = "正在登录……";

        try {
            const response = await fetch("/chat/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });
            const responseText = await response.text();
            let result = null;
            try {
                result = responseText ? JSON.parse(responseText) : null;
            } catch (ignored) {
                throw new Error("登录接口返回内容不是有效JSON");
            }

            if (!response.ok || !result || !result.data || !result.data.token) {
                const errorMessage = result && result.message
                    ? result.message
                    : "用户名或密码错误";
                throw new Error(errorMessage);
            }

            document.getElementById("token").value = result.data.token;
            document.title = "客服聊天系统 - " + result.data.username;
            loggedInUserId = result.data.userId;
            loggedInRoles = Array.isArray(result.data.roles)
                ? result.data.roles
                : [];
            updateRolePanels();
            const roles = loggedInRoles.join(", ");
            loginStatus.textContent = "登录成功：" + result.data.username
                + "（" + result.data.userId + "）"
                + (roles ? "，角色：" + roles : "");
            const roleNames = loggedInRoles.map(function (role) {
                return role === "ADMIN" ? "管理员" : (role === "AGENT" ? "客服" : (role === "USER" ? "用户" : role));
            });
            document.getElementById("currentAccountText").textContent = result.data.username
                + (roleNames.length > 0 ? " · " + roleNames.join("、") : "");
            document.getElementById("loginView").hidden = true;
            document.getElementById("appView").hidden = false;
            if (loggedInRoles.includes("ADMIN")) {
                writeLog("管理员登录成功，已进入管理模式：" + result.data.userId);
                if (socket != null && socket.readyState !== WebSocket.CLOSED) {
                    disconnectStomp(true);
                }
                setConnectionStatus("管理模式", false);
            } else {
                writeLog("网页登录成功，正在自动连接WebSocket：" + result.data.userId);
                reconnectStomp();
            }
        } catch (error) {
            loginStatus.textContent = "登录失败：" + error.message;
            writeLog("网页登录失败：" + error.message);
        } finally {
            loginButton.disabled = false;
        }
    }

    function connectStomp() {

        if (loggedInRoles.includes("ADMIN")) {
            showOperationResult("adminOperationResult", "管理员账号不需要建立聊天连接", true);
            return;
        }

        if (socket != null) {
            if (socket.readyState === WebSocket.CONNECTING) {
                writeLog("WebSocket正在连接，请勿重复点击连接");
                appendSystemMessage("聊天连接正在建立，请稍候");
                return;
            }
            if (socket.readyState === WebSocket.OPEN) {
                writeLog("WebSocket已经连接，无需重复连接");
                appendSystemMessage("聊天连接已经建立，无需重复连接");
                return;
            }
            if (socket.readyState === WebSocket.CLOSING) {
                writeLog("WebSocket正在关闭，请稍后再连接");
                appendSystemMessage("聊天连接正在断开，请稍后再连接");
                return;
            }
        }

        const token =
            document.getElementById("token")
                .value
                .trim();


        if (!token) {

            writeLog("请先登录并输入Token");
            showChatError("请先登录后再建立聊天连接");

            return;
        }


        const websocketProtocol =
            window.location.protocol === "https:"
                ? "wss://"
                : "ws://";


        const websocketUrl =
            websocketProtocol +
            window.location.host +
            "/ws/chat?token=" +
            encodeURIComponent(token);


        writeLog(
            "开始连接：" + websocketUrl
        );
        setConnectionStatus("连接中", false);
        setConnectionDescription("正在建立消息连接……");

        stopHeartbeat();

        /*
         * v12.stomp表示使用STOMP 1.2协议
         */
        socket =
            new WebSocket(
                websocketUrl,
                ["v12.stomp"]
            );
        updateActionAvailability();


        /*
         * WebSocket握手成功
         */
        socket.onopen = function () {

            writeLog(
                "WebSocket握手成功"
            );


            /*
             * 发送STOMP CONNECT帧
             *
             * 最后的 \u0000 是STOMP帧结束标志
             */
            const connectFrame =
                "CONNECT\n" +
                "accept-version:1.2\n" +
                "host:localhost\n" +
                "heart-beat:0,0\n" +
                "\n" +
                "\u0000";


            socket.send(connectFrame);


            writeLog(
                "已经发送STOMP CONNECT帧"
            );
        };


        /*
         * 收到服务器返回的信息
         */
        socket.onmessage = function (event) {

            if (
                event.data.startsWith("CONNECTED")
            ) {

                writeLog(
                    "STOMP连接成功"
                );
                setConnectionStatus("已连接", true);
                stompConnected = true;
                setConnectionDescription("消息连接正常");
                updateActionAvailability();
                appendSystemMessage("聊天连接成功");


                /*
                 * 订阅普通聊天消息
                 */
                const chatSubscribeFrame =
                    "SUBSCRIBE\n" +
                    "id:chat-subscription\n" +
                    "destination:/user/queue/chat\n" +
                    "ack:auto\n" +
                    "\n" +
                    "\u0000";


                socket.send(
                    chatSubscribeFrame
                );


                writeLog(
                    "已订阅：/user/queue/chat"
                );

                /* 已读、编辑和撤回事件统一从这个队列接收。 */
                const messageEventSubscribeFrame =
                    "SUBSCRIBE\n" +
                    "id:message-event-subscription\n" +
                    "destination:/user/queue/messages\n" +
                    "ack:auto\n" +
                    "\n" +
                    "\u0000";

                socket.send(messageEventSubscribeFrame);
                writeLog("已订阅：/user/queue/messages");


                /*
                 * 订阅当前连接的错误消息
                 */
                const errorSubscribeFrame =
                    "SUBSCRIBE\n" +
                    "id:error-subscription\n" +
                    "destination:/user/queue/errors\n" +
                    "ack:auto\n" +
                    "\n" +
                    "\u0000";


                socket.send(
                    errorSubscribeFrame
                );


                writeLog(
                    "已订阅：/user/queue/errors"
                );
                /*
 * 聊天队列和错误队列订阅完成后，
 * 主动请求拉取当前用户的离线消息
 */
                const offlinePullFrame =
                    "SEND\n" +
                    "destination:/app/chat.offline.pull\n" +
                    "content-type:application/json\n" +
                    "\n" +
                    "{}" +
                    "\u0000";


                socket.send(
                    offlinePullFrame
                );


                writeLog(
                    "已请求拉取离线消息"
                );
                /*
 * STOMP连接成功后启动心跳
 */
                startHeartbeat();

                if (loggedInRoles.includes("AGENT")) {
                    writeLog("检测到客服角色，正在自动上线");
                    setAgentStateLoading("登录成功，正在自动上线……");
                    void setAgentOnline(true);
                }
            }
            /*
 * 收到普通MESSAGE帧时，
 * 判断是不是一条聊天消息。
 */
            if (
                event.data.startsWith("MESSAGE")
            ) {

                const bodyText =
                    extractStompBody(
                        event.data
                    );


                if (bodyText) {

                    try {

                        const body =
                            JSON.parse(
                                bodyText
                            );

                        renderServerPayload(body);


                        /*
                         * 会话创建通知的sessionId位于body.session.sessionId，
                         * 聊天消息、历史记录和会话事件则直接使用body.sessionId。
                         */
                        const receivedSessionId =
                            body["sessionId"] ||
                            (body["session"] && body["session"]["sessionId"]);

                        if (receivedSessionId) {
                            document.getElementById("sessionId").value =
                                receivedSessionId;
                        }


                        /*
                         * 真正的ChatMessage同时包含：
                         * id
                         * sessionId
                         * senderId
                         *
                         * SESSION_CREATED、ERROR、CHAT_HISTORY
                         * 不满足这些条件，因此不会误发ACK。
                         */
                        if (
                            body["id"] &&
                            body["sessionId"] &&
                            body["senderId"]
                        ) {

                            document.getElementById("messageId").value = body["id"];
                            const receivedRow = Array.from(document.querySelectorAll("[data-message-id]"))
                                .find(element => element.dataset.messageId === body["id"]);
                            if (receivedRow) {
                                selectMessage(receivedRow);
                            }
                            updateActionAvailability();

                            /* RECEIVED/STORED是发送方状态回执，不能再当成接收消息ACK。 */
                            if (AUTO_ACK && !body["ackStatus"]) {

                                sendBusinessAck(
                                    body["id"]
                                );

                            } else if (!body["ackStatus"]) {

                                writeLog(
                                    "自动业务ACK已关闭，messageId："
                                    + body["id"]
                                );
                            }
                        }
                    } catch (error) {

                        /*
                         * 某些服务器帧不是JSON，
                         * 不需要因此中断页面。
                         */
                        writeLog(
                            "当前MESSAGE不是可确认的聊天消息"
                        );
                    }
                }
            }
        };


        /*
         * 连接关闭
         */
        socket.onclose = function () {
            stopHeartbeat();
            stompConnected = false;
            sessionActive = false;
            setConnectionStatus(loggedInRoles.includes("ADMIN") ? "管理模式" : "未连接", false);
            if (!loggedInRoles.includes("ADMIN")) {
                setConnectionDescription("消息连接已经断开");
            }
            writeLog(
                "连接已经关闭"
            );

            socket = null;
            updateSessionDisplay(document.getElementById("sessionId").value.trim());
        };


        /*
         * 连接出错
         */
        socket.onerror = function () {
            stompConnected = false;
            setConnectionStatus("连接异常", false);
            setConnectionDescription("消息连接发生异常，请重新连接");
            appendSystemMessage("聊天连接发生异常，请重新连接", true);
            updateActionAvailability();
            writeLog(
                "连接发生错误"
            );
        };
    }

    /** 账号重新登录时，等待旧连接完全关闭后再使用新Token连接。 */
    function reconnectStomp() {
        if (socket == null || socket.readyState === WebSocket.CLOSED) {
            connectStomp();
            return;
        }

        const previousSocket = socket;
        previousSocket.addEventListener(
            "close",
            function () {
                if (socket == null || socket === previousSocket) {
                    connectStomp();
                }
            },
            {once: true}
        );
        disconnectStomp(true);
    }
    /*
     * 发送业务消息ACK
     */
    function sendBusinessAck(messageId) {

        if (
            socket == null ||
            socket.readyState !== WebSocket.OPEN
        ) {

            writeLog(
                "ACK发送失败：连接已断开"
            );

            return;
        }


        const requestBody = {
            messageId: messageId
        };


        const ackFrame =
            "SEND\n" +
            "destination:/app/chat.ack\n" +
            "content-type:application/json\n" +
            "\n" +
            JSON.stringify(requestBody) +
            "\u0000";


        socket.send(
            ackFrame
        );


        writeLog(
            "已发送业务ACK，messageId："
            + messageId
        );
    }
    /**
     * 向服务端发送一次心跳
     */
    function sendHeartbeat() {

        /*
         * WebSocket不存在或没有处于连接状态时，
         * 不发送心跳。
         */
        if (
            socket === null ||
            socket.readyState !== WebSocket.OPEN
        ) {

            return;
        }


        /*
         * 构造STOMP SEND帧
         *
         * 对应服务端：
         * @MessageMapping("/chat.heartbeat")
         */
        const frame =
            "SEND\n"
            + "destination:/app/chat.heartbeat\n"
            + "content-type:application/json\n"
            + "\n"
            + "{}\u0000";


        socket.send(
            frame
        );
    }


    /**
     * 开始定时发送心跳
     */
    function startHeartbeat() {

        /*
         * 先停止旧定时器，
         * 防止重复连接后出现多个心跳定时器。
         */
        stopHeartbeat();


        /*
         * STOMP连接成功后立即发送一次心跳，
         * 不需要先等待30秒。
         */
        sendHeartbeat();


        /*
         * 之后每30秒发送一次。
         */
        heartbeatTimer =
            setInterval(
                sendHeartbeat,
                HEARTBEAT_INTERVAL_MS
            );
    }


    /**
     * 停止心跳定时器
     */
    function stopHeartbeat() {

        if (heartbeatTimer !== null) {

            clearInterval(
                heartbeatTimer
            );


            heartbeatTimer = null;
        }
    }
    /*
 * 从STOMP帧中提取JSON消息体
 */
    function extractStompBody(frame) {

        const bodyStart =
            frame.indexOf("\n\n");


        if (bodyStart === -1) {

            return null;
        }


        return frame
            .substring(bodyStart + 2)
            .replace(/\u0000/g, "")
            .trim();
    }
    function sendChatMessage() {

        if (!stompConnected || socket == null || socket.readyState !== WebSocket.OPEN) {
            showChatError("聊天连接尚未建立，暂时不能发送消息");
            return;
        }


        const sessionId =
            document.getElementById(
                "sessionId"
            ).value.trim();


        const messageContent =
            document.getElementById(
                "messageContent"
            ).value.trim();


        const clientMsgIdInput =
            document.getElementById(
                "clientMsgId"
            );


        let clientMsgId =
            clientMsgIdInput.value.trim();


        if (!sessionId) {
            showChatError("当前还没有可用会话，请等待系统分配客服");
            return;
        }


        if (!messageContent) {
            showChatError("请输入需要发送的消息内容");
            return;
        }


        /*
         * clientMsgId为空时自动生成。
         * 生成后写回输入框。
         *
         * 因此再次点击发送时，
         * 会继续使用同一个clientMsgId，
         * 方便测试消息去重。
         */
        if (!clientMsgId) {

            clientMsgId =
                "client-" + Date.now();

            clientMsgIdInput.value =
                clientMsgId;
        }


        const messageBody = {

            sessionId: sessionId,

            type: "TEXT",

            content: messageContent,

            clientMsgId: clientMsgId
        };


        const sendFrame =
            "SEND\n" +
            "destination:/app/chat.send\n" +
            "content-type:application/json\n" +
            "\n" +
            JSON.stringify(messageBody) +
            "\u0000";


        socket.send(
            sendFrame
        );

        /* 当前消息发送后清空，下次发送时自动生成新的幂等消息ID。 */
        clientMsgIdInput.value = "";
        document.getElementById("messageContent").value = "";
        appendChatBubble(messageContent, {
            kind: "mine",
            sender: "我 · 发送中",
            clientMsgId: clientMsgId
        });
        writeLog("已发送聊天消息");
    }

    function restartConsultation() {

         */

    function requireToken(resultElementId) {
        const token = document.getElementById("token").value.trim();
        if (!token) {
            writeLog("请先粘贴登录Token");
            if (resultElementId) {
                showOperationResult(resultElementId, "请先登录后再执行该操作", true);
            }
            return null;
        }
        return token;
    }

    async function callRest(method, path, requestBody, resultElementId, successFormatter) {
        const token = requireToken(resultElementId);
        if (!token) {
            return null;
        }
        const options = {
            method: method,
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }
        };
        if (requestBody !== undefined && requestBody !== null) {
            options.body = JSON.stringify(requestBody);
        }
        try {
            const response = await fetch(path, options);
            const text = await response.text();
            let body = text;
            try {
                body = text ? JSON.parse(text) : null;
            } catch (ignored) {
                // 非JSON响应直接显示原文。
            }
            const resultMessage = body && typeof body === "object" && body.message
                ? body.message
                : (response.ok ? "操作成功" : "操作失败");
            writeLog(method + " " + path + "，HTTP " + response.status + "，" + resultMessage);
            if (!response.ok) {
                throw new Error(resultMessage);
            }
            const displayMessage = typeof successFormatter === "function"
                ? successFormatter(body)
                : resultMessage;
            if (resultElementId) {
                showOperationResult(resultElementId, displayMessage, false);
            }
            return body;
        } catch (error) {
            writeLog("REST请求失败：" + error.message);
            if (resultElementId) {
                showOperationResult(resultElementId, "操作失败：" + error.message, true);
            }
            return null;
        }
    }

    async function updateVipCustomer() {
        const userId = document.getElementById("vipUserId").value.trim();
        const vipLevelText = document.getElementById("vipLevel").value.trim();
        const vipLevel = Number(vipLevelText);
        if (!userId) {
            writeLog("请输入需要设置VIP的用户ID");
            showOperationResult("adminOperationResult", "请输入需要设置 VIP 的用户 ID", true);
            return;
        }
        if (!Number.isInteger(vipLevel) || vipLevel < 0 || vipLevel > 5) {
            writeLog("VIP等级必须是0到5之间的整数");
            showOperationResult("adminOperationResult", "VIP 等级必须是 0 到 5 之间的整数", true);
            return;
        }
        await callRest(
            "PUT",
            "/users/" + encodeURIComponent(userId),
            {vipLevel: vipLevel},
            "adminOperationResult"
        );
    }

    async function setAgentOnline(online) {
        const previousState = agentOnlineState;
        agentStateChanging = true;
        agentTargetOnline = online;
        setAgentStateLoading(online ? "正在上线……" : "正在离线并结束当前会话……");
        const result = await callRest(
            "POST",
            online ? "/chat/agent/online" : "/chat/agent/offline",
            null,
            "agentOperationResult"
        );
        if (result) {
            setAgentWorkState(online);
            appendSystemMessage(online
                ? "客服已上线，可以接待用户"
                : "客服已离线，当前会话已经结束");
        } else if (previousState != null) {
            setAgentWorkState(previousState);
        } else {
            setAgentWorkState(false);
        }
        agentStateChanging = false;
        agentTargetOnline = null;
        if (online) {
            flushPendingAgentSessionNotices();
        } else {
            pendingAgentSessionNotices = [];
        }
    }

    async function setVipAgentSkill(enabled) {
        const agentId = document.getElementById("vipAgentId").value.trim();
        if (!agentId) {
            writeLog("请输入客服ID");
            showOperationResult("adminOperationResult", "请输入需要管理的客服 ID", true);
            return;
        }
        await callRest(
            enabled ? "PUT" : "DELETE",
            "/chat/agents/" + encodeURIComponent(agentId) + "/vip-skill",
            null,
            "adminOperationResult"
        );
    }

    async function queryVipAgentSkills() {
        await callRest(
            "GET",
            "/chat/agents/vip-skill",
            null,
            "adminOperationResult",
            function (body) {
                const data = body && Array.isArray(body.data) ? body.data : [];
                return data.length > 0
                    ? "VIP 客服技能组：" + data.join("、")
                    : "VIP 客服技能组当前为空";
            }
        );
    }

    function sendStompJson(destination, requestBody, actionName) {
        if (!stompConnected || socket == null || socket.readyState !== WebSocket.OPEN) {
            showChatError("聊天连接尚未建立，暂时不能执行消息操作");
            return false;
        }
        const frame =
            "SEND\n" +
            "destination:" + destination + "\n" +
            "content-type:application/json\n" +
            "\n" +
            JSON.stringify(requestBody) +
            "\u0000";
        socket.send(frame);
        writeLog(actionName);
        appendSystemMessage(actionName);
        return true;
    }

    function requireMessageOperationInput(requireSession) {
        const messageId = document.getElementById("messageId").value.trim();
        const sessionId = document.getElementById("sessionId").value.trim();
        if (!messageId) {
            showChatError("请先选择一条消息，再执行该操作");
            return null;
        }
        if (requireSession && !sessionId) {
            showChatError("当前没有会话，无法标记消息已读");
            return null;
        }
        return {messageId: messageId, sessionId: sessionId};
    }

    function markMessageRead() {
        const input = requireMessageOperationInput(true);
        if (!input) {
            return;
        }
        sendStompJson(
            "/app/chat.read",
            {sessionId: input.sessionId, lastReadMessageId: input.messageId},
            "已发送标记已读请求"
        );
    }

    function editChatMessage() {
        const input = requireMessageOperationInput(false);
        if (!input) {
            return;
        }
        const content = document.getElementById("editedMessageContent").value.trim();
        if (!content) {
            showChatError("请输入编辑后的消息内容");
            return;
        }
        sendStompJson(
            "/app/chat.message.edit",
            {messageId: input.messageId, content: content},
            "已发送消息编辑请求"
        );
    }

    function recallChatMessage() {
        const input = requireMessageOperationInput(false);
        if (!input) {
            return;
        }
        sendStompJson(
            "/app/chat.message.recall",
            {messageId: input.messageId},
            "已发送消息撤回请求"
        );
    }

    function disconnectStomp(silent) {
        stopHeartbeat();
        if (socket == null || socket.readyState === WebSocket.CLOSED) {
            if (!silent) {
                showChatError("当前没有已连接的聊天会话");
            }
            return;
        }

        if (socket.readyState === WebSocket.CONNECTING) {
            socket.close();
            stompConnected = false;
            updateActionAvailability();
            writeLog("正在取消WebSocket连接");
            if (!silent) {
                appendSystemMessage("正在取消聊天连接");
            }
            return;
        }

        if (socket.readyState === WebSocket.CLOSING) {
            writeLog("WebSocket正在关闭");
            if (!silent) {
                appendSystemMessage("聊天连接正在断开，请稍候");
            }
            return;
        }


        /*
         * 先发送STOMP DISCONNECT帧
         */
        const disconnectFrame =
            "DISCONNECT\n" +
            "receipt:disconnect-001\n" +
            "\n" +
            "\u0000";


        socket.send(
            disconnectFrame
        );


        /*
         * 然后关闭WebSocket
         */
        socket.close();
        stompConnected = false;
        updateActionAvailability();
        writeLog("已经发送断开请求");
        if (!silent) {
            appendSystemMessage("已主动断开聊天连接");
        }
    }

    document.getElementById("messageContent").addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendChatMessage();
        }
    });

    document.getElementById("chatMessages").addEventListener("click", function (event) {
        selectMessage(event.target.closest(".message-row.selectable"));
    });

    updateActionAvailability();

</script>
