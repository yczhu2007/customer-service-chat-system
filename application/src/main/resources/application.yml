spring:
  application:
    name: customer-service-chat-system
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

mybatis-plus:
  mapper-locations:
    - classpath*:mapper/*Mapper.xml
  type-aliases-package: com.example.customerservice.domain
  configuration:
    map-underscore-to-camel-case: true

app:
  auth:
    # 登录Token写入Redis时设置TTL，过期后认证自动失效。
    token-ttl-minutes: ${AUTH_TOKEN_TTL_MINUTES:30}
    # 勾选“记住我”后使用较长有效期，仍可通过退出登录、改密或禁用账号立即吊销。
    remember-token-ttl-days: ${AUTH_REMEMBER_TOKEN_TTL_DAYS:7}
    # 恢复码过期后，已登录用户可在账号资料中重新生成。
    recovery-code-ttl-days: ${AUTH_RECOVERY_CODE_TTL_DAYS:90}
    rate-limit:
      max-requests: ${AUTH_REGISTRATION_RATE_LIMIT_MAX_REQUESTS:5}
      window-seconds: ${AUTH_REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:60}
      # 仅当应用只允许可信反向代理访问时开启，防止客户端伪造X-Forwarded-For。
      trust-forwarded-headers: ${AUTH_TRUST_FORWARDED_HEADERS:false}
  frontend:
    dev-server-url: ${FRONTEND_DEV_SERVER_URL:}
  bootstrap:
    admin:
      # 开发环境也需显式开启，避免误配时创建固定管理员账号。
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      id: admin
      username: admin
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  chat:
    agent-reconnect-grace-seconds: ${CHAT_AGENT_RECONNECT_GRACE_SECONDS:20}
    # 客服上线恢复会话时，单次IN查询的最大会话ID数量。
    agent-session-restore-batch-size: ${CHAT_AGENT_SESSION_RESTORE_BATCH_SIZE:100}
    vip:
      reserved-slots: ${CHAT_VIP_RESERVED_SLOTS:1}
    persist:
      alert-threshold: ${CHAT_PERSIST_ALERT_THRESHOLD:20}
    reconciliation:
      active-session-batch-size: ${CHAT_ACTIVE_SESSION_RECONCILIATION_BATCH_SIZE:200}
    redis-retention-sweep-delay-ms: ${CHAT_REDIS_RETENTION_SWEEP_DELAY_MS:3600000}
    message:
      recall-window-seconds: ${CHAT_MESSAGE_RECALL_WINDOW_SECONDS:120}
      edit-window-seconds: ${CHAT_MESSAGE_EDIT_WINDOW_SECONDS:300}
    attachment:
      cleanup-initial-delay-ms: ${CHAT_ATTACHMENT_CLEANUP_INITIAL_DELAY_MS:300000}
      cleanup-delay-ms: ${CHAT_ATTACHMENT_CLEANUP_DELAY_MS:86400000}
      orphan-grace-period-seconds: ${CHAT_ATTACHMENT_ORPHAN_GRACE_PERIOD_SECONDS:3600}
      preview:
        command: ${CHAT_ATTACHMENT_PREVIEW_COMMAND:soffice}
        timeout-seconds: ${CHAT_ATTACHMENT_PREVIEW_TIMEOUT_SECONDS:30}
        max-output-bytes: ${CHAT_ATTACHMENT_PREVIEW_MAX_OUTPUT_BYTES:20971520}
      migration:
        enabled: ${ATTACHMENT_MIGRATION_ENABLED:false}
        legacy-storage-path: ${CHAT_ATTACHMENT_LEGACY_STORAGE_PATH:./data/chat-attachments}
    session:
      inactivity-timeout-seconds: ${CHAT_SESSION_INACTIVITY_TIMEOUT_SECONDS:1800}
      inactivity-sweep-delay-ms: ${CHAT_SESSION_INACTIVITY_SWEEP_DELAY_MS:30000}
    queue:
      timeout-seconds: ${CHAT_QUEUE_TIMEOUT_SECONDS:300}
      vip-timeout-seconds: ${CHAT_VIP_QUEUE_TIMEOUT_SECONDS:120}
      sweep-delay-ms: ${CHAT_QUEUE_SWEEP_DELAY_MS:15000}
      average-handle-seconds: ${CHAT_QUEUE_AVERAGE_HANDLE_SECONDS:300}
      # 每个VIP等级提前10^12毫秒，严格保持高等级VIP优先；普通用户由排队超时策略兜底。
      # 数值按秒配置；默认值足够大以保持不同 VIP 等级的严格优先级。
      vip-priority-step-seconds: ${CHAT_VIP_PRIORITY_STEP_SECONDS:1000000000}
      # 普通用户达到该等待时长后进入保障优先层，避免持续被VIP用户插队。
      anti-starvation-seconds: ${CHAT_QUEUE_ANTI_STARVATION_SECONDS:180}
