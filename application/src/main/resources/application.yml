spring:
  application:
    name: customer-service-chat-system
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/springboot?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

mybatis-plus:
  mapper-locations:
    - classpath*:mapper/*Mapper.xml
  type-aliases-package: com.example.customerservice.domain
  configuration:
    map-underscore-to-camel-case: true

app:
  auth:
    # 登录Token写入Redis时设置TTL，过期后认证自动失效。
    token-ttl-minutes: ${AUTH_TOKEN_TTL_MINUTES:30}
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  bootstrap:
    admin:
      enabled: true
      id: admin
      username: admin
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  chat:
    agent-reconnect-grace-seconds: ${CHAT_AGENT_RECONNECT_GRACE_SECONDS:20}
    # 客服上线恢复会话时，单次IN查询的最大会话ID数量。
    agent-session-restore-batch-size: ${CHAT_AGENT_SESSION_RESTORE_BATCH_SIZE:100}
    vip:
      reserved-slots: ${CHAT_VIP_RESERVED_SLOTS:1}
    persist:
      alert-threshold: ${CHAT_PERSIST_ALERT_THRESHOLD:20}
    message:
      recall-window-seconds: ${CHAT_MESSAGE_RECALL_WINDOW_SECONDS:120}
      edit-window-seconds: ${CHAT_MESSAGE_EDIT_WINDOW_SECONDS:300}
    session:
      inactivity-timeout-seconds: ${CHAT_SESSION_INACTIVITY_TIMEOUT_SECONDS:1800}
      inactivity-sweep-delay-ms: ${CHAT_SESSION_INACTIVITY_SWEEP_DELAY_MS:30000}
    queue:
      timeout-seconds: ${CHAT_QUEUE_TIMEOUT_SECONDS:300}
      vip-timeout-seconds: ${CHAT_VIP_QUEUE_TIMEOUT_SECONDS:120}
      sweep-delay-ms: ${CHAT_QUEUE_SWEEP_DELAY_MS:15000}
      average-handle-seconds: ${CHAT_QUEUE_AVERAGE_HANDLE_SECONDS:300}
      # 每个VIP等级提前10^12毫秒，严格保持高等级VIP优先；普通用户由排队超时策略兜底。
      vip-priority-step-seconds: ${CHAT_VIP_PRIORITY_STEP_SECONDS:1000000000}
      # 普通用户达到该等待时长后进入保障优先层，避免持续被VIP用户插队。
      anti-starvation-seconds: ${CHAT_QUEUE_ANTI_STARVATION_SECONDS:180}
